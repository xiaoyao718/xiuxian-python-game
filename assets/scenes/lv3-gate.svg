<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b33"/>
      <stop offset="0.6" stop-color="#1a1e23"/>
      <stop offset="1" stop-color="#14100e"/>
    </linearGradient>
    <radialGradient id="dusk3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e3a05f" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#c97c49" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c97c49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a3" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#e8a45c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8a45c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#sky3)"/>

  <!-- 日暮低光 -->
  <ellipse cx="480" cy="262" rx="380" ry="210" fill="url(#dusk3)"/>

  <!-- 远山 -->
  <path d="M0 308 L96 246 L204 304 L330 214 L470 306 L612 232 L768 306 L888 248 L960 300 L960 420 L0 420 Z"
        fill="#1c2329" opacity="0.75"/>
  <path d="M0 356 L130 300 L262 352 L420 268 L580 354 L730 298 L884 356 L960 322 L960 420 L0 420 Z"
        fill="#12161a" opacity="0.92"/>

  <!-- 地面 -->
  <path d="M0 380 L960 380 L960 420 L0 420 Z" fill="#0c0e10"/>

  <!-- 测纹处牌坊 -->
  <g fill="#0e1217">
    <rect x="408" y="248" width="18" height="132"/>
    <rect x="534" y="248" width="18" height="132"/>
    <rect x="400" y="228" width="160" height="20"/>
    <path d="M352 244 L480 196 L608 244 L620 234 L480 182 L340 234 Z"/>
    <path d="M382 258 L480 222 L578 258 L586 250 L480 210 L374 250 Z"/>
  </g>
  <!-- 匾额与细纹 -->
  <rect x="440" y="236" width="80" height="15" fill="#171c22"/>
  <path d="M452 243 L508 243" stroke="#c8a44b" stroke-width="1.2" opacity="0.55"/>

  <!-- 灯笼 -->
  <circle cx="424" cy="262" r="9" fill="url(#lantern3)"/>
  <circle cx="536" cy="262" r="9" fill="url(#lantern3)"/>
  <circle cx="424" cy="262" r="2.6" fill="#ffd99a"/>
  <circle cx="536" cy="262" r="2.6" fill="#ffd99a"/>

  <!-- 排队剪影 -->
  <g fill="#05070a">
    <ellipse cx="238" cy="388" rx="22" ry="27"/>
    <circle cx="238" cy="354" r="8"/>
    <ellipse cx="300" cy="391" rx="21" ry="24"/>
    <circle cx="300" cy="360" r="7.5"/>
    <ellipse cx="356" cy="393" rx="18" ry="21"/>
    <circle cx="356" cy="366" r="6.5"/>
    <ellipse cx="664" cy="390" rx="21" ry="25"/>
    <circle cx="664" cy="358" r="7.5"/>
    <ellipse cx="724" cy="392" rx="19" ry="22"/>
    <circle cx="724" cy="364" r="6.8"/>
    <ellipse cx="778" cy="393" rx="17" ry="20"/>
    <circle cx="778" cy="367" r="6.2"/>
  </g>

  <!-- 暮霭 -->
  <ellipse cx="220" cy="360" rx="330" ry="46" fill="#8ea2ad" opacity="0.10" filter="url(#soft3)"/>
  <ellipse cx="780" cy="356" rx="320" ry="50" fill="#a89782" opacity="0.09" filter="url(#soft3)"/>
  <ellipse cx="480" cy="318" rx="540" ry="30" fill="#cbb79a" opacity="0.06" filter="url(#soft3)"/>

  <!-- 飞尘微光 -->
  <g fill="#d9c39a">
    <circle cx="300" cy="220" r="1.6" opacity="0.5"/>
    <circle cx="652" cy="180" r="1.5" opacity="0.5"/>
    <circle cx="820" cy="250" r="1.4" opacity="0.45"/>
    <circle cx="160" cy="270" r="1.4" opacity="0.4"/>
    <circle cx="500" cy="120" r="1.5" opacity="0.45"/>
  </g>
</svg>
