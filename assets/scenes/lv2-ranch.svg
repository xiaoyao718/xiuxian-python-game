  <path d="M0 366 L330 366" stroke="#0a120e" stroke-width="4" opacity="0.9"/>
  <path d="M0 380 L330 380" stroke="#0a120e" stroke-width="4" opacity="0.9"/>
  <g stroke="#0a120e" stroke-width="5" opacity="0.92">
    <path d="M36 358 L36 388"/>
    <path d="M90 358 L90 388"/>
    <path d="M144 358 L144 388"/>
    <path d="M198 358 L198 388"/>
    <path d="M252 358 L252 388"/>
    <path d="M306 358 L306 388"/>
