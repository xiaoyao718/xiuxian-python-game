<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24352d"/>
      <stop offset="0.55" stop-color="#16241e"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
    <radialGradient id="qiGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9f0e2" stop-opacity="0.46"/>
      <stop offset="0.62" stop-color="#8fd3c4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8fd3c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2d9a6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2d9a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
