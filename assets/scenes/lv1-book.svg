<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f18"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8a44b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c8a44b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6cf"/>
      <stop offset="1" stop-color="#cfc3a2"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="url(#sky)"/>

  <!-- 山影 -->
  <path d="M0 350 L120 260 L230 330 L360 235 L470 330 L600 270 L730 340 L860 255 L960 320 L960 420 L0 420 Z"
        fill="#0d131d" opacity="0.95"/>
  <path d="M0 385 L180 320 L330 370 L520 300 L700 375 L860 330 L960 380 L960 420 L0 420 Z"
        fill="#080c13" opacity="0.9"/>

  <!-- 书页辉光 -->
  <ellipse cx="480" cy="210" rx="300" ry="180" fill="url(#glow)"/>

  <!-- 泛光的凡人书页 -->
  <g transform="rotate(-2 480 210)">
    <rect x="330" y="95" width="300" height="230" rx="3" fill="url(#paper)"
          stroke="#8a7c5a" stroke-width="1.5"/>
    <rect x="360" y="130" width="130" height="7" rx="3" fill="#b3a485" opacity="0.55"/>
    <rect x="360" y="152" width="190" height="7" rx="3" fill="#b3a485" opacity="0.45"/>
    <rect x="360" y="174" width="90" height="7" rx="3" fill="#c8a44b" opacity="0.9"/>
    <rect x="360" y="196" width="220" height="7" rx="3" fill="#b3a485" opacity="0.4"/>
    <rect x="360" y="218" width="160" height="7" rx="3" fill="#b3a485" opacity="0.4"/>
    <rect x="360" y="250" width="80" height="7" rx="3" fill="#8a7c5a" opacity="0.6"/>
  </g>

  <!-- 悬浮灵光 -->
  <g fill="#c8a44b">
    <circle cx="260" cy="130" r="2.4" opacity="0.9"/>
    <circle cx="700" cy="100" r="2" opacity="0.7"/>
    <circle cx="760" cy="190" r="1.6" opacity="0.5"/>
    <circle cx="220" cy="230" r="1.8" opacity="0.65"/>
    <circle cx="620" cy="300" r="2.2" opacity="0.5"/>
    <circle cx="300" cy="330" r="1.5" opacity="0.5"/>
  </g>

  <!-- 淡雾 -->
  <ellipse cx="760" cy="360" rx="260" ry="70" fill="#76837a" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="150" cy="370" rx="240" ry="60" fill="#76837a" opacity="0.08" filter="url(#soft)"/>
</svg>
