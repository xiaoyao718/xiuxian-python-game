<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a26"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23282f"/>
      <stop offset="0.5" stop-color="#3a414b"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8a44b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8a44b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe1a0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c8a44b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="url(#sky4)"/>

  <!-- 远山 -->
  <path d="M0 380 L140 300 L260 370 L420 285 L560 375 L720 310 L860 378 L960 330 L960 420 L0 420 Z"
        fill="#0b0f17" opacity="0.9"/>

  <!-- 地面 -->
  <rect x="0" y="380" width="960" height="40" fill="#080b10"/>

  <!-- 光柱 -->
  <rect x="462" y="80" width="36" height="300" rx="18" fill="url(#beam)" filter="url(#soft4)"/>
  <rect x="472" y="80" width="16" height="300" rx="8" fill="#ffe1a0" opacity="0.5"/>

  <!-- 75 分刻点 -->
  <circle cx="480" cy="128" r="26" fill="url(#burst)"/>
  <circle cx="480" cy="128" r="5" fill="#ffe1a0"/>
  <circle cx="480" cy="128" r="9" fill="none" stroke="#ffe1a0" stroke-width="1.5" opacity="0.85"/>

  <!-- 分纹台 -->
  <path d="M400 380 L416 300 L544 300 L560 380 Z" fill="url(#stone)" stroke="#4a525e" stroke-width="1.5"/>
  <rect x="430" y="292" width="100" height="14" rx="3" fill="#2b313a" stroke="#4a525e" stroke-width="1"/>
  <path d="M392 380 L568 380" stroke="#11151b" stroke-width="3"/>

  <!-- 纹路 -->
  <path d="M445 320 q10 -8 20 0 q10 8 20 0" fill="none" stroke="#c8a44b" stroke-width="1.6" opacity="0.65"/>
  <path d="M445 342 q10 -8 20 0 q10 8 20 0" fill="none" stroke="#c8a44b" stroke-width="1.6" opacity="0.45"/>

  <!-- 围观者剪影 -->
  <g fill="#05070b">
    <ellipse cx="190" cy="388" rx="26" ry="30"/>
    <circle cx="190" cy="350" r="9"/>
    <ellipse cx="250" cy="390" rx="24" ry="28"/>
    <circle cx="250" cy="354" r="8"/>
    <ellipse cx="750" cy="388" rx="26" ry="30"/>
    <circle cx="750" cy="350" r="9"/>
    <ellipse cx="815" cy="390" rx="22" ry="26"/>
    <circle cx="815" cy="356" r="7.5"/>
  </g>

  <!-- 光尘 -->
  <g fill="#c8a44b">
    <circle cx="330" cy="210" r="1.8" opacity="0.6"/>
    <circle cx="640" cy="170" r="1.5" opacity="0.5"/>
    <circle cx="700" cy="280" r="2" opacity="0.5"/>
    <circle cx="250" cy="300" r="1.5" opacity="0.4"/>
    <circle cx="380" cy="130" r="1.5" opacity="0.5"/>
  </g>
</svg>
